[package]
name = "bimrust"
version = "0.28.7"
edition = "2021"
license = "MIT"
description = "BimRust - vizualizare si coordonare modele BIM (IFC / glTF)"

[lib]
name = "bimrust"
path = "src/lib.rs"

[[bin]]
name = "ManageBIM"
path = "src/main.rs"

[dependencies]
# text in exported images and videos (4D date, legend) - already used by egui, MIT / Apache-2.0
ab_glyph = "0.2.32"
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
glam = "0.29"
egui_extras = { version = "0.29.1", default-features = false }
earcutr = "0.4"
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras"] }
base64 = "0.22"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
jpeg-encoder = "0.6"
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
gif = "0.13"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
acadrust = "0.6.8"
# baza de date a proiectului Plant 3D (Piping.dcf = SQLite), doar citire; MIT, SQLite inclus (bundled)
rusqlite = { version = "0.32", features = ["bundled"] }
# iconite vectoriale (Phosphor, MIT) in locul emoji-urilor
egui-phosphor = "0.7.3"
# motorul de scripturi pentru consola Script (Rhai, MIT/Apache-2.0)
rhai = { version = "1.20", default-features = false, features = ["std", "no_module", "no_custom_syntax"] }
laz = "0.9"

# dialogurile de fisiere: Windows nativ; Linux / FreeBSD prin xdg-desktop-portal
[target.'cfg(any(windows, unix))'.dependencies]
rfd = "0.15"

[build-dependencies]
# compileaza shim-ul OpenCascade (src/occt/mbocct.cpp) cu MSVC - vezi build.rs
cc = "1"

[features]
# programele de instalare a add-in-urilor (Windows): includ DLL-urile construite de revit-addin / acad-addin /
# navis-addin (nu sunt in repo). Activat de tools/make-backup.ps1 (cargo build --release --features addins); fara el se construieste doar aplicatia.
addins = []

[profile.release]
opt-level = 3
lto = "thin"
# pastram tabela de simboluri: crash.log din %APPDATA%\ManageBIM ramane lizibil
# (nume de functii in backtrace); codul de debug si tabelele de linii se elimina
strip = "debuginfo"

[profile.dev]
opt-level = 1

[[bin]]
name = "ManageBIM-Revit-AddIn"
path = "src/bin/addin/revit.rs"
required-features = ["addins"]

[[bin]]
name = "ManageBIM-AutoCAD-AddIn"
path = "src/bin/addin/acad.rs"
required-features = ["addins"]

[[bin]]
name = "ManageBIM-Navisworks-AddIn"
path = "src/bin/addin/navis.rs"
required-features = ["addins"]

[[bin]]
name = "bimc-convert"
path = "src/bin/bimc_convert.rs"
