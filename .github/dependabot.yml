# Actualizari automate ale dependintelor (PR-uri saptamanale, grupate ca sa nu fie zeci de PR-uri).
# Salturile mari de versiune (ex. eframe 0.29 -> 0.37: API schimbat) nu se propun automat - se fac manual.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust-minor:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /installers/setup
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      setup-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
