# Actualizari automate ale dependintelor (PR-uri saptamanale, grupate ca sa nu fie zeci de PR-uri).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /installers/setup
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      setup-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
