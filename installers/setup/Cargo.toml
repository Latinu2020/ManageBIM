[package]
name = "managebim-setup"
version = "0.27.27"
edition = "2021"
description = "ManageBIM - installer intr-un singur .exe (aplicatie + OpenCascade + add-in-uri), per utilizator, fara admin"

# proiect separat: pachetul (ManageBIM.exe, add-in-urile...) se construieste intai, apoi se impacheteaza aici
[workspace]

[[bin]]
name = "ManageBIM-Setup"
path = "main.rs"

[dependencies]
miniz_oxide = "0.8"
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }

[build-dependencies]
miniz_oxide = "0.8"

[profile.release]
opt-level = 2
strip = true
